schema_version: 2
kind: FeaturePackage

policy:
  id: "{{POLICY_ID}}"
  version: "{{POLICY_VERSION}}"
  digest: "{{POLICY_DIGEST}}"

feature:
  id: "{{FEATURE_ID}}"
  slug: "{{FEATURE_SLUG}}"
  title: "{{TITLE}}"
  summary: "{{TITLE}}"
  lifecycle: proposed
  profile: "{{PROFILE}}"
  delivery_target: "{{DELIVERY_TARGET}}"
  created_at: "{{DATE}}"
  updated_at: "{{DATE}}"
  owners:
    # Stable actor ID used by Decisions and approval keys. `{{OWNER}}` is the
    # optional human-readable owner label used in narrative documents.
    accountable: "{{OWNER_ID}}"
    role_assignments:
      - actor: "{{OWNER_ID}}"
        roles:
          - accountable_owner
          - requirement_owner
    # Add technical_owner, verifier, reviewer, contract_owner and release_owner
    # assignments explicitly when the Feature actually needs them.

classification:
  risk: low
  data: "{{DATA_CLASSIFICATION}}"
  # 闭集：contract_breaking/database_migration/restricted_data/irreversible_operation/
  # regulated_data/production_security_boundary/contract_change/external_side_effect/
  # ai_behavior_change/public_unknown_consumers
  risk_factors: []

size:
  class: small
  repositories: 1
  boundaries: 0
  acceptance_criteria: 1
  slices: 1
  estimated_active_days: 1

acceptance_criteria:
  - id: AC-001
    statement: "{{TITLE}} 的最小可验证结果"

repositories:
  - id: "{{REPOSITORY_ID}}"
    # canonical checkout identity 与 repo 内 path 分离。
    identity:
      kind: current
      name: "{{REPOSITORY_NAME}}"
      url: "{{REPOSITORY_IDENTITY}}"
      root: "."
    path: "{{REPOSITORY_SCOPE}}"
    # Use null for a scoped path. If the explicit scope is ".", replace this
    # text with a project-specific, auditable whole-repository justification.
    root_scope_justification: "{{ROOT_SCOPE_JUSTIFICATION}}"
    root_scope_exception_evidence_id: null
    role: implementation
    baseline:
      sha: null
      evidence_id: null

dependencies: []

# 每个跨进程、跨仓库、跨版本、持久化或重放边界单独登记。
# Lite Profile 不允许 boundary；非空 boundary 会创建同 ID 的 G2C Gate 实例。
boundaries: []

slices:
  - id: SLC-001
    title: "最小纵向切片"
    outcome: "验证 AC-001"
    depends_on: []
    boundary_ids: []
    acceptance_criteria: [AC-001]
    repositories: ["{{REPOSITORY_ID}}"]
    paths:
      - repository: "{{REPOSITORY_ID}}"
        path: "{{REPOSITORY_SCOPE}}"
    authorization_decision_id: null

# applicability 由 Profile、Target 和实际影响共同决定。
# required 必须存在；conditional 只在条件触发后 materialize；not_applicable 不创建。
artifacts:
  - id: ART-BRIEF
    kind: brief
    path: 00-feature-brief.md
    authority: normative
    applicability: required
    reason: core
  - id: ART-REQUIREMENTS
    kind: requirements
    path: 01-requirements.md
    authority: normative
    applicability: required
    reason: core
  - id: ART-IMPACT
    kind: impact_assessment
    path: 02-impact-assessment.md
    authority: normative
    applicability: required
    reason: core
  - id: ART-DECISIONS
    kind: decisions_and_risks
    path: 03-decisions-and-risks.md
    authority: normative
    applicability: "{{ARTIFACT_03_APPLICABILITY}}"
    reason: "{{ARTIFACT_03_REASON}}"
  - id: ART-CONTRACT
    kind: contract_change_plan
    path: 04-contract-change-plan.md
    authority: index
    applicability: "{{ARTIFACT_04_APPLICABILITY}}"
    reason: "{{ARTIFACT_04_REASON}}"
  - id: ART-DESIGN
    kind: technical_design
    path: 05-technical-design.md
    authority: normative
    applicability: "{{ARTIFACT_05_APPLICABILITY}}"
    reason: "{{ARTIFACT_05_REASON}}"
  - id: ART-TEST
    kind: test_plan
    path: 06-test-plan.md
    authority: normative
    applicability: required
    reason: core
  - id: ART-IMPLEMENTATION
    kind: implementation_plan
    path: 07-implementation-plan.md
    authority: normative
    applicability: required
    reason: core
  - id: ART-VERIFICATION
    kind: verification_report
    path: 08-verification-report.md
    authority: index
    applicability: required
    reason: core
  - id: ART-RELEASE
    kind: release_and_rollback
    path: 09-release-and-rollback.md
    authority: normative
    applicability: "{{ARTIFACT_09_APPLICABILITY}}"
    reason: "{{ARTIFACT_09_REASON}}"
  - id: ART-SUMMARY
    kind: delivery_summary
    path: 10-delivery-summary.md
    authority: summary
    applicability: conditional
    reason: materialize_after_terminal_gate
